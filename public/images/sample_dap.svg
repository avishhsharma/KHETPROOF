<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="gradDap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="#f0f9ff" rx="16"/>
  <!-- Bag Shape -->
  <rect x="100" y="30" width="200" height="250" rx="12" fill="url(#gradDap)" stroke="#075985" stroke-width="4"/>
  <!-- Top Label Header -->
  <rect x="115" y="45" width="170" height="48" rx="6" fill="#ffffff"/>
  <text x="200" y="68" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0369a1" text-anchor="middle">COROMANDEL</text>
  <text x="200" y="84" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">GROMOR DAP (18:46:0)</text>
  
  <!-- Fertilizer Bag Center Emblem -->
  <circle cx="200" cy="140" r="32" fill="#bae6fd" opacity="0.4"/>
  <text x="200" y="146" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">DAP</text>
  
  <!-- Batch & Specification Box -->
  <rect x="115" y="185" width="170" height="80" rx="6" fill="#ffffff" opacity="0.95"/>
  <text x="125" y="205" font-family="monospace" font-size="10" font-weight="bold" fill="#0f172a">BATCH: CR-DAP-2026</text>
  <text x="125" y="220" font-family="sans-serif" font-size="10" fill="#334155">MFG: 05/2026 | EXP: 04/2029</text>
  <text x="125" y="235" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0284c7">FCO SCHEDULE-I CERTIFIED</text>
  <text x="125" y="250" font-family="sans-serif" font-size="9" fill="#0369a1">Net Wt: 50 kg | 18% N, 46% P</text>
  
  <!-- Verified Badge -->
  <rect x="15" y="15" width="115" height="28" rx="14" fill="#0284c7"/>
  <text x="72" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">✓ FCO APPROVED</text>
</svg>
