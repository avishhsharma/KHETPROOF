<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="gradLabel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="#f8fafc" rx="16"/>
  <!-- Bottle Cap -->
  <rect x="180" y="25" width="40" height="25" rx="4" fill="#059669"/>
  <!-- Bottle Neck -->
  <rect x="185" y="50" width="30" height="20" fill="#e2e8f0"/>
  <!-- Bottle Body -->
  <rect x="135" y="70" width="130" height="210" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <!-- Brand Header -->
  <rect x="145" y="85" width="110" height="42" rx="6" fill="url(#gradLabel)"/>
  <text x="200" y="104" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">BAYER</text>
  <text x="200" y="119" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#a7f3d0" text-anchor="middle">BELT EXPERT</text>
  
  <!-- Chemical Content -->
  <text x="200" y="145" font-family="sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="bold">Flubendiamide + Thiacloprid</text>
  <text x="200" y="160" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle">सोयाबीन इल्ली व कीट नियंत्रण</text>
  
  <!-- Batch Box -->
  <rect x="145" y="180" width="110" height="75" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="150" y="198" font-family="monospace" font-size="9" font-weight="bold" fill="#0f172a">B.NO: BY-BLT-882</text>
  <text x="150" y="213" font-family="sans-serif" font-size="8" fill="#334155">MFG: 03/2026</text>
  <text x="150" y="228" font-family="sans-serif" font-size="8" fill="#334155">EXP: 02/2028</text>
  <text x="150" y="243" font-family="sans-serif" font-size="8" font-weight="bold" fill="#059669">CIBRC: CIR-198421</text>
  
  <!-- Verified Badge -->
  <rect x="15" y="15" width="120" height="28" rx="14" fill="#059669"/>
  <text x="75" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">✓ CIBRC VERIFIED</text>
</svg>
