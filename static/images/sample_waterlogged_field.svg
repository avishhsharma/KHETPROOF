<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  
  <!-- Overcast Sky -->
  <rect width="400" height="130" fill="url(#skyGrad)"/>
  
  <!-- Rain streaks -->
  <line x1="30" y1="20" x2="10" y2="70" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="120" y1="10" x2="100" y2="80" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="220" y1="30" x2="200" y2="90" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="330" y1="15" x2="310" y2="75" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  
  <!-- Background distant trees -->
  <ellipse cx="60" cy="130" rx="70" ry="25" fill="#166534"/>
  <ellipse cx="180" cy="130" rx="90" ry="30" fill="#14532d"/>
  <ellipse cx="320" cy="130" rx="80" ry="25" fill="#166534"/>
  
  <!-- Muddy ground / field -->
  <rect x="0" y="130" width="400" height="190" fill="#78350f"/>
  
  <!-- Submerged soybean plants -->
  <g fill="#4ade80" stroke="#15803d" stroke-width="1.5">
    <!-- Row 1 -->
    <path d="M 50 170 Q 40 150 45 135 Q 60 145 55 170"/>
    <path d="M 120 165 Q 110 145 115 130 Q 130 140 125 165"/>
    <path d="M 210 170 Q 200 145 205 132 Q 220 142 215 170"/>
    <path d="M 300 165 Q 290 145 295 133 Q 310 143 305 165"/>
    <!-- Row 2 -->
    <path d="M 80 210 Q 70 180 75 165 Q 90 175 85 210"/>
    <path d="M 160 215 Q 150 185 155 170 Q 170 180 165 215"/>
    <path d="M 260 210 Q 250 180 255 165 Q 270 175 265 210"/>
    <path d="M 340 215 Q 330 185 335 170 Q 350 180 345 215"/>
  </g>
  
  <!-- Standing Flood Water overlay -->
  <rect x="0" y="175" width="400" height="145" fill="url(#waterGrad)"/>
  
  <!-- Water ripples -->
  <ellipse cx="100" cy="240" rx="40" ry="8" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="260" cy="260" rx="55" ry="10" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="180" cy="200" rx="30" ry="6" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>

  <!-- Geotag & Time Stamp Bar (Mandatory PMFBY Evidence Standard) -->
  <rect x="10" y="270" width="380" height="42" fill="#0f172a" rx="6" opacity="0.92"/>
  <circle cx="28" cy="291" r="10" fill="#ef4444"/>
  <text x="28" y="295" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">REC</text>
  
  <text x="46" y="285" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">खेतप्रूफ जिओ-टैग साक्ष्य (Geo-Proof)</text>
  <text x="46" y="298" font-family="monospace" font-size="8.5" fill="#38bdf8">23°23'07.2"N 77°48'37.8"E | बरखेड़ी, गैरतगंज (रायसेन)</text>
  <text x="46" y="308" font-family="monospace" font-size="8" fill="#cbd5e1">20-09-2026 10:30:14 IST | वर्षा: 84mm | खसरा: 142/2</text>
</svg>
